<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" rx="20" fill="#e8f4ff"/>
  <!-- tail -->
  <path d="M215 235 C 275 225, 275 150, 240 140" stroke="#f4a340" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="150" cy="225" rx="75" ry="55" fill="#f4a340"/>
  <ellipse cx="150" cy="235" rx="40" ry="35" fill="#ffe2b8"/>
  <!-- ears -->
  <polygon points="80,95 95,30 135,75" fill="#f4a340"/>
  <polygon points="220,95 205,30 165,75" fill="#f4a340"/>
  <polygon points="92,85 100,48 123,74" fill="#ffb6c1"/>
  <polygon points="208,85 200,48 177,74" fill="#ffb6c1"/>
  <!-- head -->
  <circle cx="150" cy="120" r="70" fill="#f4a340"/>
  <!-- stripes -->
  <path d="M150 52 L150 75 M130 55 L135 75 M170 55 L165 75" stroke="#d9822b" stroke-width="6" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="122" cy="115" rx="14" ry="18" fill="#fff"/>
  <ellipse cx="178" cy="115" rx="14" ry="18" fill="#fff"/>
  <circle cx="125" cy="118" r="9" fill="#2b2b2b"/>
  <circle cx="181" cy="118" r="9" fill="#2b2b2b"/>
  <circle cx="128" cy="114" r="3" fill="#fff"/>
  <circle cx="184" cy="114" r="3" fill="#fff"/>
  <!-- nose and mouth -->
  <polygon points="143,140 157,140 150,149" fill="#ff7b9c"/>
  <path d="M150 149 Q 140 162 130 155 M150 149 Q 160 162 170 155" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M105 140 L65 132 M105 148 L65 152 M195 140 L235 132 M195 148 L235 152" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="108" cy="150" r="8" fill="#ff9eb5" opacity="0.6"/>
  <circle cx="192" cy="150" r="8" fill="#ff9eb5" opacity="0.6"/>
  <!-- paws -->
  <ellipse cx="120" cy="275" rx="18" ry="11" fill="#ffe2b8"/>
  <ellipse cx="180" cy="275" rx="18" ry="11" fill="#ffe2b8"/>
</svg>
