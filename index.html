<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After School Lessons</title>

    <script src="lessons.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

    <div id="app">
        <header>
            <h1 v-text="sitename"></h1>

            <!-- Cart button: enabled once at least one lesson is in the cart.
                 On the cart page it is always enabled so the user can go back. -->
            <button class="cart-btn" v-on:click="toggleCart()" v-bind:disabled="cart.length === 0 && !showCart">
                <i class="fa fa-shopping-cart" aria-hidden="true"></i>
                {{ showCart ? 'Back to lessons' : 'Cart (' + cart.length + ')' }}
            </button>
        </header>

        <main>
            <!-- ======================= LESSON PAGE ======================= -->
            <div v-if="!showCart">
                <div class="lesson" v-for="lesson in lessons" v-bind:key="lesson._id">
                    <i v-bind:class="'fa fa-3x ' + lesson.icon" aria-hidden="true"></i>
                    <h2>{{lesson.topic}}</h2>
                    <p>Location: {{lesson.location}}</p>
                    <p>Price: £{{lesson.price}}</p>
                    <p>Spaces: {{spacesLeft(lesson)}}</p>

                    <!-- Always visible, disabled when there are no spaces left -->
                    <button class="add-btn" v-on:click="addToCart(lesson)" v-bind:disabled="!canAddToCart(lesson)">
                        Add to cart
                    </button>
                </div>
            </div>

            <!-- ======================== CART PAGE ======================== -->
            <div v-else>
                <h2>Your Cart</h2>
                <p v-if="cart.length === 0">Your cart is empty.</p>

                <div v-for="lesson in lessons" v-bind:key="lesson._id">
                    <p v-if="cartCount(lesson._id) > 0">
                        {{lesson.topic}} ({{lesson.location}}) x {{cartCount(lesson._id)}}
                        <button v-on:click="removeFromCart(lesson)">Remove</button>
                    </p>
                </div>

                <h2>Checkout</h2>
                <p>Name: <input v-model="order.name"></p>
                <p>Phone: <input v-model="order.phone"></p>

                <!-- Always visible, only enabled when name and phone are valid -->
                <button class="add-btn" v-on:click="submitOrder()" v-bind:disabled="!canCheckout">Checkout</button>

                <p v-if="orderMessage">{{orderMessage}}</p>
            </div>
        </main>
    </div>

    <script type="module">
        const {createApp} = Vue
        const app = createApp({
            data(){
                return{
                    sitename: "After School Lessons",
                    lessons: lessonsArray,
                    cart: [],            // holds lesson _id values, one per space booked
                    showCart: false,
                    order: {
                        name: "",
                        phone: ""
                    },
                    orderMessage: ""
                }
            },
            computed:{
                nameIsValid: function(){
                    return /^[A-Za-z ]+$/.test(this.order.name.trim());
                },
                phoneIsValid: function(){
                    return /^[0-9]+$/.test(this.order.phone.trim());
                },
                canCheckout: function(){
                    return this.nameIsValid && this.phoneIsValid && this.cart.length > 0;
                }
            },
            methods:{
                // how many times a lesson id appears in the cart
                cartCount(id){
                    return this.cart.filter(item => item === id).length;
                },
                // spaces left = spaces in the database minus spaces already in the cart
                spacesLeft(lesson){
                    return lesson.space - this.cartCount(lesson._id);
                },
                canAddToCart(lesson){
                    return this.spacesLeft(lesson) > 0;
                },
                addToCart(lesson){
                    if (this.canAddToCart(lesson)) {
                        this.cart.push(lesson._id);
                        this.orderMessage = "";
                    }
                },
                removeFromCart(lesson){
                    const index = this.cart.indexOf(lesson._id);
                    if (index !== -1) {
                        this.cart.splice(index, 1);
                    }
                },
                toggleCart(){
                    this.showCart = !this.showCart;
                },
                submitOrder(){
                    this.orderMessage = "Order submitted! Thank you, " + this.order.name + ".";
                    this.cart = [];
                    this.order.name = "";
                    this.order.phone = "";
                }
            }
        })
        app.mount('#app')
    </script>

</body>
</html>
