<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After School Lessons</title>

    <script src="lessons.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <header>
            <h1><i class="fa fa-graduation-cap" aria-hidden="true"></i> {{sitename}}</h1>

            <!-- Cart button: enabled once at least one lesson is in the cart.
                 On the cart page it is always enabled so the user can go back. -->
            <button class="cart-btn" v-on:click="toggleCart()" v-bind:disabled="cart.length === 0 && !showCart">
                <i class="fa" v-bind:class="showCart ? 'fa-arrow-left' : 'fa-shopping-cart'" aria-hidden="true"></i>
                {{ showCart ? 'Back to lessons' : 'Cart (' + cart.length + ')' }}
            </button>
        </header>

        <main>
            <!-- ======================= LESSON PAGE ======================= -->
            <div v-if="!showCart">
                <!-- Sort controls -->
                <div class="controls">
                    <label>Sort by:
                        <select v-model="sortBy">
                            <option value="topic">Subject</option>
                            <option value="location">Location</option>
                            <option value="price">Price</option>
                            <option value="space">Spaces</option>
                        </select>
                    </label>
                    <label><input type="radio" value="asc" v-model="sortOrder"> Ascending</label>
                    <label><input type="radio" value="desc" v-model="sortOrder"> Descending</label>
                </div>

                <div class="lesson-grid">
                    <div class="lesson" v-for="lesson in sortedLessons" v-bind:key="lesson._id">
                        <div class="lesson-body">
                            <h2><i v-bind:class="'fa ' + lesson.icon" aria-hidden="true"></i> {{lesson.topic}}</h2>
                            <p><strong>Location:</strong> {{lesson.location}}</p>
                            <p><strong>Price:</strong> £{{lesson.price}}</p>
                            <p><strong>Spaces:</strong> {{spacesLeft(lesson)}}</p>
                            <div class="spacer"></div>

                            <!-- Always visible, disabled when there are no spaces left -->
                            <button class="add-btn" v-on:click="addToCart(lesson)" v-bind:disabled="!canAddToCart(lesson)">
                                <i class="fa fa-cart-plus" aria-hidden="true"></i> Add to cart
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ======================== CART PAGE ======================== -->
            <div v-else class="cart-layout">
                <div class="panel">
                    <h2>Your Cart</h2>
                    <p class="empty" v-if="cart.length === 0">Your cart is empty.</p>

                    <!-- One row per lesson that is in the cart (lessons with 0 copies are skipped) -->
                    <template v-for="lesson in lessons" v-bind:key="lesson._id">
                        <div class="cart-item" v-if="cartCount(lesson._id) > 0">
                            <div>
                                <strong><i v-bind:class="'fa ' + lesson.icon" aria-hidden="true"></i> {{lesson.topic}}</strong>
                                – {{lesson.location}}<br>
                                {{cartCount(lesson._id)}} x £{{lesson.price}}
                            </div>
                            <button class="remove-btn" v-on:click="removeFromCart(lesson)">
                                <i class="fa fa-trash" aria-hidden="true"></i> Remove
                            </button>
                        </div>
                    </template>
                    <p class="cart-total" v-if="cart.length > 0">Total: £{{cartTotal}}</p>
                </div>

                <!-- Checkout is part of the cart page -->
                <div class="panel">
                    <h2>Checkout</h2>
                    <div class="field">
                        <label for="name">Name</label>
                        <input id="name" type="text" v-model="order.name" placeholder="Letters only">
                        <p class="hint" v-if="order.name && !nameIsValid">Name must contain letters only.</p>
                    </div>
                    <div class="field">
                        <label for="phone">Phone</label>
                        <input id="phone" type="tel" v-model="order.phone" placeholder="Numbers only">
                        <p class="hint" v-if="order.phone && !phoneIsValid">Phone must contain numbers only.</p>
                    </div>

                    <!-- Always visible, only enabled when name and phone are valid -->
                    <button class="add-btn" v-on:click="submitOrder()" v-bind:disabled="!canCheckout">
                        <i class="fa fa-check" aria-hidden="true"></i> Checkout
                    </button>

                    <p class="message success" v-if="orderMessage">{{orderMessage}}</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        const {createApp} = Vue
        const app = createApp({
            data(){
                return{
                    sitename: "After School Lessons",
                    lessons: lessonsArray,
                    cart: [],            // holds lesson _id values, one per space booked
                    showCart: false,
                    sortBy: "topic",     // topic, location, price or space
                    sortOrder: "asc",    // asc or desc
                    order: {
                        name: "",
                        phone: ""
                    },
                    orderMessage: ""
                }
            },
            computed:{
                // A sorted COPY of the lessons, re-calculated whenever sortBy,
                // sortOrder, the lessons or the cart change
                sortedLessons: function(){
                    const direction = this.sortOrder === "asc" ? 1 : -1;
                    return [...this.lessons].sort((a, b) => {
                        let valueA, valueB;
                        if (this.sortBy === "space") {
                            // sort by the spaces currently left
                            valueA = this.spacesLeft(a);
                            valueB = this.spacesLeft(b);
                        } else {
                            valueA = a[this.sortBy];
                            valueB = b[this.sortBy];
                        }
                        if (typeof valueA === "string") {
                            return valueA.localeCompare(valueB) * direction;
                        }
                        return (valueA - valueB) * direction;
                    });
                },
                cartTotal: function(){
                    let total = 0;
                    for (const id of this.cart) {
                        const lesson = this.lessons.find(l => l._id === id);
                        if (lesson) total += lesson.price;
                    }
                    return total;
                },
                nameIsValid: function(){
                    return /^[A-Za-z ]+$/.test(this.order.name.trim());
                },
                phoneIsValid: function(){
                    return /^[0-9]+$/.test(this.order.phone.trim());
                },
                canCheckout: function(){
                    return this.nameIsValid && this.phoneIsValid && this.cart.length > 0;
                }
            },
            methods:{
                // how many times a lesson id appears in the cart
                cartCount(id){
                    return this.cart.filter(item => item === id).length;
                },
                // spaces left = spaces in the database minus spaces already in the cart
                spacesLeft(lesson){
                    return lesson.space - this.cartCount(lesson._id);
                },
                canAddToCart(lesson){
                    return this.spacesLeft(lesson) > 0;
                },
                addToCart(lesson){
                    if (this.canAddToCart(lesson)) {
                        this.cart.push(lesson._id);
                        this.orderMessage = "";
                    }
                },
                removeFromCart(lesson){
                    const index = this.cart.indexOf(lesson._id);
                    if (index !== -1) {
                        this.cart.splice(index, 1);
                    }
                },
                toggleCart(){
                    this.showCart = !this.showCart;
                },
                submitOrder(){
                    this.orderMessage = "Order submitted! Thank you, " + this.order.name + ".";
                    this.cart = [];
                    this.order.name = "";
                    this.order.phone = "";
                }
            }
        })
        app.mount('#app')
    </script>

</body>
</html>
